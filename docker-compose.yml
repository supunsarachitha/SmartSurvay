# SmartSurvey — container stack: PostgreSQL 16 + the web app.
#   docker compose up -d --build         → http://localhost:8080
# Settings come from environment variables or a .env file next to this file (see .env.example), e.g.:
#   WEB_PORT=8081 POSTGRES_PORT=5433 ADMIN_PASSWORD='S3cure!Pass' docker compose up -d --build
# Step-by-step instructions: README.md → "Run with Docker".
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartsurvey
      POSTGRES_USER: smartsurvey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartsurvey}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartsurvey -d smartsurvey"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    image: smartsurvey:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=smartsurvey;Username=smartsurvey;Password=${POSTGRES_PASSWORD:-smartsurvey}"
      Database__Provider: PostgreSQL
      Database__ApplyMigrationsOnStartup: "true"
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@smartsurvey.local}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-ChangeMe123!}
      Seed__SuperAdminEmail: ${SUPERADMIN_EMAIL:-superadmin@smartsurvey.local}
      Seed__SuperAdminPassword: ${SUPERADMIN_PASSWORD:-ChangeMe123!}
      Seed__DemoData: ${DEMO_DATA:-true}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      Support__BuyMeACoffeeUsername: ${BMC_USERNAME:-jkhy9gtjs}
      Support__GitHubUrl: ${GITHUB_URL:-https://github.com/supunsarachitha/SmartSurvay}
      # Spam/bot protection for anonymous responses (proof of work, timing, honeypot). Keep it on for public surveys.
      BotProtection__Enabled: ${BOT_PROTECTION:-true}
      # Encrypt respondents' written answers in the database. The keys live in the "keys" volume — back it up with the database.
      Encryption__Enabled: ${ENCRYPTION:-true}
      # Account e-mails (password reset, confirmation). Leave SMTP_HOST empty to disable e-mail.
      Email__FromAddress: ${MAIL_FROM:-no-reply@smartsurvey.local}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Security: ${SMTP_SECURITY:-Auto}
      Email__Smtp__UserName: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      # Data-protection key ring: sign-in cookies AND the keys that decrypt stored answers.
      # Back it up together with the database — without it, encrypted answers cannot be read.
      - keys:/app/keys

volumes:
  pgdata:
  keys:
