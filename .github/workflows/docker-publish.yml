name: Docker image

# Publishes the container image to the GitHub Container Registry (ghcr.io/<owner>/<repository>, the "Packages" of
# the repository) for linux/amd64 and linux/arm64:
#   * a version tag such as v2.1.0                                -> 2.1.0, 2.1, 2 and latest
#   * a push to main that changes the app or its container build  -> edge
#   * a manual run (Actions -> Docker image -> Run workflow)      -> edge on main, the branch name elsewhere
# Nothing is published unless the CI workflow passes and the image of each platform passes the container smoke test.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "src/**"
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - global.json
      - Directory.Build.props
      - Directory.Packages.props
      - scripts/container-smoke.sh
      - .github/workflows/ci.yml
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_TITLE: SmartSurvey
  IMAGE_DESCRIPTION: Self-hosted survey platform with conditional logic, workspaces and exportable reports
  IMAGE_LICENSES: PolyForm-Noncommercial-1.0.0

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build & smoke test (${{ matrix.platform }})
    needs: ci
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # Each platform is built on a runner of its own architecture: no emulation, and the smoke test runs the real image.
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Version tag matches Directory.Build.props
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          tag="${GITHUB_REF_NAME#v}"
          if [ "${tag%%-*}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in Directory.Build.props."
            exit 1
          fi

      - name: Image name (registry names are lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.licenses=${{ env.IMAGE_LICENSES }}

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: smartsurvey:latest
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Start the stack (app + PostgreSQL)
        run: docker compose up -d --no-build
      - name: Smoke test the container
        run: scripts/container-smoke.sh http://localhost:8080 admin@smartsurvey.local 'ChangeMe123!'
      - name: Container logs
        if: always()
        run: docker compose logs web
      - name: Stop the stack
        if: always()
        run: docker compose down -v

      - name: Sign in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same build again (served from the build cache), pushed without a tag; the publish job gives the
      # images of both platforms their common tags.
      - name: Push the image by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}

      - name: Export the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish (amd64 + arm64)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image name (registry names are lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Sign in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=ref,event=branch,enable=${{ github.ref_name != 'main' }}
          annotations: |
            org.opencontainers.image.title=${{ env.IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.licenses=${{ env.IMAGE_LICENSES }}

      - name: Tag the images of both platforms as one
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          arguments=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then arguments+=(--tag "$tag"); fi
          done <<< "$TAGS"
          while IFS= read -r annotation; do
            if [ -n "$annotation" ]; then arguments+=(--annotation "$annotation"); fi
          done <<< "$ANNOTATIONS"
          for digest in *; do
            arguments+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${arguments[@]}"

      - name: Published image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          {
            echo "### Published"
            echo
            echo '```'
            while IFS= read -r tag; do
              if [ -n "$tag" ]; then echo "docker pull $tag"; fi
            done <<< "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
