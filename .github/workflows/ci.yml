name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SmartSurvey.sln

      - name: Build
        run: dotnet build SmartSurvey.sln --no-restore -c Release

      - name: Test
        run: dotnet test SmartSurvey.sln --no-build -c Release --logger "trx;LogFileName=results.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  migrations:
    name: Apply migrations to PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smartsurvey
          POSTGRES_USER: smartsurvey
          POSTGRES_PASSWORD: smartsurvey
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartsurvey -d smartsurvey"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - name: Apply EF Core migrations
        env:
          SMARTSURVEY_MIGRATIONS_CONNECTION: Host=localhost;Port=5432;Database=smartsurvey;Username=smartsurvey;Password=smartsurvey
        run: dotnet ef database update --project src/SmartSurvey.Infrastructure --startup-project src/SmartSurvey.Web

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: smartsurvey:ci
